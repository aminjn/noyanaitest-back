# ts.noyanai.com - whole app on one origin:
#   /api/*          -> backend  (127.0.0.1:5100, incl. socket.io websockets)
#   /files/*        -> backend  static Public/ folder (FILE_PATH)
#   everything else -> Next.js  (127.0.0.1:3100)
#
# Install:  cp deploy/nginx/ts.noyanai.com.conf /etc/nginx/sites-available/
#           ln -s /etc/nginx/sites-available/ts.noyanai.com.conf /etc/nginx/sites-enabled/
#           certbot --nginx -d ts.noyanai.com     (fills in the ssl_* lines)
#           nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name ts.noyanai.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name ts.noyanai.com;

    ssl_certificate     /etc/letsencrypt/live/ts.noyanai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ts.noyanai.com/privkey.pem;

    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Backend API + socket.io (path /api/socket.io)
    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_read_timeout 300s;
    }

    # Uploaded files: /files/x.jpg -> backend's express.static(Public)/x.jpg
    location /files/ {
        proxy_pass http://127.0.0.1:5100/;
        expires 7d;
    }

    # Next.js
    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
