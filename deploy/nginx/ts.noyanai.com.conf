# ts.noyanai.com - whole app on one origin:
#   /api/*          -> backend  (127.0.0.1:5100, incl. socket.io websockets)
#   /files/*        -> backend  static Public/ folder (FILE_PATH)
#   everything else -> Next.js  (127.0.0.1:3100)
#
# The same site on 80 and 443 with no HTTP->HTTPS redirect: Arvan's edge
# serves HTTPS to visitors and may reach this server over either protocol
# (a redirect here loops forever when it uses HTTP). deploy/arvan/setup.sh
# installs this file and gets the certificate.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 443 ssl http2;
    server_name ts.noyanai.com;

    ssl_certificate     /etc/letsencrypt/live/ts.noyanai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ts.noyanai.com/privkey.pem;

    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # Backend API + socket.io (path /api/socket.io)
    location /api/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_read_timeout 300s;
    }

    # Uploaded files: /files/x.jpg -> backend's express.static(Public)/x.jpg
    location /files/ {
        proxy_pass http://127.0.0.1:5100/;
        expires 7d;
    }

    # Next.js
    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
